<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping list example</title>
    <style>
      li {
        margin-bottom: 10px;
      }

      li button {
        font-size: 12px;
        margin-left: 20px;
        color: #666;
      }
    </style>
  </head>
  <body>

    <h1>My shopping list</h1>

    <div>
      <label for="item">Enter a new item:</label>
      <input type="text" name="item" id="item">
      <button>Add item</button>
    </div>

    <ul>

    </ul>

    <script>

      const ulRef = document.querySelector("ul");
      const inputRef = document.querySelector("input");
      const btn = document.querySelector("button");

      btn.addEventListener("click", btnClick);
      
      function btnClick () {
        let curVal = inputRef.value
        const liRef = document.createElement("li");
        const spanRef = document.createElement("span");
        const NbtnRef = document.createElement("button");
        liRef.appendChild(spanRef);
        liRef.appendChild(NbtnRef);

        spanRef.textContent = curVal;
        NbtnRef.textContent = "delete";

        ulRef.appendChild(liRef);

        NbtnRef.addEventListener("click", () => liRef.remove());
        inputRef.focus();
      };

    

    </script>
  </body>
</html>
