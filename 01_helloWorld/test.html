const people = [
      {
        name: "Carly",
        yearOfBirth: 1942,
        yearOfDeath: 1970,
      },
      {
        name: "Ray",
        yearOfBirth: 1962,
        yearOfDeath: 2011,
      },
      {
        name: "Jane",
        yearOfBirth: 1912,
        yearOfDeath: 1941,
      },
    ]

const findTheOldest = function(persons) {
    //add age
    persons.map(((val) => val.age = val.yearOfDeath - val.yearOfBirth));
    return persons.sort((a,b) => b.age - a.age);
};
